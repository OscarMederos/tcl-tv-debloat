name: shellcheck

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          for f in scripts/*.sh; do
            bash -n "$f"
          done
      - name: ShellCheck
        run: shellcheck --severity=warning scripts/*.sh
